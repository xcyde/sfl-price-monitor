name: sfl-price-monitor

services:
  api:
    build: .
    command: node dist/index.js
    env_file: .env
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch(`http://127.0.0.1:$${process.env.PORT||3000}/health`).then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bot:
    build: .
    command: node dist/bot.js
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is not set in .env — get a token from @BotFather}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:?BOT_INTERNAL_SECRET is not set in .env — generate one with openssl rand -hex 16}
      API_BASE_URL: "http://api:${PORT:-3000}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env — set your domain for prod, or DOMAIN=:80 for local testing}
      PORT: ${PORT:-3000}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
