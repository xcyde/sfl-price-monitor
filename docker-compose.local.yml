services:
  api:
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    environment:
      DATABASE_URL: postgres://sfl:sfl@db:5432/sfl
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
      POSTGRES_DB: sfl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  edge:
    external: false
    name: sfl-local-edge

volumes:
  pgdata:
    name: sfl-local-pgdata
